name: Build And Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"

      - name: Test worldlod
        shell: powershell
        working-directory: worldlod
        run: |
          uv run --frozen ruff check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          uv run --frozen ruff format --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          uv run --frozen pytest
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Build And Test
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File .\build.ps1

      - name: Verify Release Files
        shell: powershell
        run: |
          $required = @(
            ".\dist\winmm.dll",
            ".\dist\dsf_enhanced.asi",
            ".\dist\dsf_enhanced.ini",
            ".\dist\README.md",
            ".\dist\LICENSE",
            ".\dist\DSF-Enhanced.zip",
            ".\dist\worldlod.zip"
          )

          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path)) {
              throw "Missing release file: $path"
            }
          }

      - name: Prepare Release Zips
        shell: powershell
        run: |
          # a branch name can hold "/" (manual runs): not in a file name
          $name = "${{ github.ref_name }}" -replace '[\/]', '-'
          Add-Content -Path $env:GITHUB_ENV -Value "ZIP_NAME=$name"  # ASCII, no BOM
          Copy-Item -LiteralPath ".\dist\DSF-Enhanced.zip" -Destination "DSF-Enhanced-$name.zip" -Force
          Copy-Item -LiteralPath ".\dist\worldlod.zip" -Destination "worldlod-$name.zip" -Force

      - name: Upload Test Artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: DSF-Enhanced-${{ env.ZIP_NAME }}
          path: |
            DSF-Enhanced-${{ env.ZIP_NAME }}.zip
            worldlod-${{ env.ZIP_NAME }}.zip

      - name: Create GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            DSF-Enhanced-${{ env.ZIP_NAME }}.zip
            worldlod-${{ env.ZIP_NAME }}.zip
