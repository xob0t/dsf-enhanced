[General]
Log=1
; Logs frame rate and traffic counts (roads, lanes, vehicles) every 2 s to dsf_enhanced.log.
TrafficDiagnostics=0

[Display]
RemoveVSync=0
; Forces D3D9 windowed presentation and removes the Win32 window frame.
BorderlessWindowed=1

[Quality]
; 0 disables the override. 16 forces texture sampling up to 16x AF.
AnisotropicFiltering=16
; Forces point/minimal filtering requests up to trilinear where possible.
ForceTrilinearFiltering=1
; Prevents sampler state from forcing lower-resolution mip levels.
ForceHighestMip=1
; Negative values sharpen distant textures but can shimmer. 0.0 leaves game bias unchanged.
TextureLODBias=0.0
; Experimental multiplier for single-value pixel shader distance/fade constants in r10-r15. 1 disables.
LODDistanceScale=1.0
; LOD threshold multiplier for the Terrain, Pedestrian and Driver categories (1, 3, 4). 1 keeps the preset.
LODEngineThresholdScale=0.25
; Draws traffic cars with their full-detail mesh out to the vehicle cull distance, instead of
; switching to reduced meshes and a wheel-less hull past about 55 m (High preset).
VehicleFullDetail=1
; Vehicle (category 2) LOD threshold multiplier when VehicleFullDetail=0. 0.25 doubles every switch distance.
VehicleLODThresholdScale=0.25
; Vehicle cull distance in metres for a mid-size car (buses go farther). 0 keeps the preset
; (about 930 m on High at 21:9). Always kept beyond the traffic spawn ring.
VehicleDrawDistance=0
; Static-world category-0 LOD threshold multiplier. 0.25 keeps higher detail farther away.
MapDetailLODThresholdScale=0.25
; Absolute native imposter draw distance. Range is 0-7000; use -1 to leave it unchanged.
ImposterDrawDistance=-1
; Radius in metres around the player within which roads carry traffic (cars spawn and despawn
; at its edge). 350 is the game's value. Larger values also fix the game's road-grid list,
; which otherwise overflows above 360 m and makes cars pop in next to the player.
; Range 350-500: beyond 500 m the game's traffic vehicle and lane pools overflow (700 m crashed).
TrafficSpawnRadius=500
; Experimental multiplier for InterestingVehicleManager near spawn distance. 1 disables.
InterestingVehicleMinDistanceScale=1.0
; Experimental multiplier for InterestingVehicleManager far spawn distance. 1 disables.
InterestingVehicleMaxDistanceScale=1.0
; Experimental requested slot count for InterestingVehicleManager. 0 leaves unchanged, max is 10.
InterestingVehicleSlotCount=0
; Preloads every native civilian-traffic vehicle pool once to reduce late city-car model/LOD streaming.
PreloadAllTrafficVehiclePools=0
; Expands the native traffic candidate acceptance window before city cars are created. 1 disables.
TrafficCandidateWindowScale=1.0
; Compresses native city-car spawn retry scheduling. 1 disables.
TrafficSpawnIntervalScale=1.0
; Draws the passengers of the car you drive (after a Shift into a traffic car) in the in-car
; cameras too. The game hides everyone in the player's car there, not only the driver, whom the
; cockpit arms replace. 0 keeps them hidden.
CockpitPassengers=1

[Lights]
; Distance curves of the position/brake lamp flare sprites, as distance:value pairs (curve input
; is roughly the camera distance in metres). Values keep their last slope past the last point.
; Empty keeps the game's curve. Game defaults: scale 6:0, 80:0.5, 300:1.5 (a streak that grows
; with distance), transparency 0:0.5, 20:0.5, 300:0.5, brightness 0:1, 20:2.5, 300:2.5.
; These defaults keep far flares a small dot that fades out.
DRLFlareScale=6:0, 80:0.45, 300:0.6
DRLFlareTransparency=
DRLFlareBrightness=0:1, 20:2.5, 300:1.2

[Shadows]
; Width and height in texels of the sun shadow maps, for every graphics preset. The presets use
; 768 (Low), 1024 (Medium) and 1536 (High); bigger maps give sharper, less blocky shadow edges.
; The game renders two maps (near and far), 8 bytes a texel each, so video memory goes from
; 38 MB at 1536 to 67 MB at 2048, 151 MB at 3072 and 268 MB at 4096. Range 256-4096; 0 keeps
; the preset's size.
ShadowMapSize=3072

[Startup]
; Bypasses only the frontend iLegalScreen timer's wait branch. Resource references still loading
; when the legal screen ends early are kept, so the world load doesn't crash later.
SkipLegalScreen=1
; Auto-acknowledges only the obsolete "connection to Ubisoft server has been lost" prompt.
SuppressUbisoftServerLostPrompt=1

[Garage]
; In the garage's vehicles screen, once a maker's cars are open, Down opens the next maker's
; cars and Up the previous maker's, at their first car (Left/Right still move through the
; cars). Stops at the first and last maker, as the maker list does. 0 keeps Up/Down moving
; the focus to the BACK button. (Replaces VerticalCarList, where Up/Down moved through the cars.)
UpDownSwitchesMaker=1

[Limits]
; The engine keeps every resident resource (models, buffers, textures, materials) in a hash
; arena of 45,000 nodes with no overflow check; past that the game crashes (0xBAEDC7). Bigger
; world or car archives can need more. This many extra nodes (24 bytes each) are used once the
; stock ones run out. 0 leaves the engine's arena alone.
ResourceArenaExtraNodes=135000
; For testing the extension: use only this many of the 45,000 stock nodes (default 45000).
ResourceArenaStockNodes=45000
; The engine's list of resource references waiting to be resolved holds 16,384 entries with no
; overflow check. Loading a model adds one per submodel, so a world archive with a bigger global
; region (worldlod) needs more. This many entries (12 bytes each) are used instead; 16384 or less
; leaves the engine's list alone.
PendingResourceReferences=131072
; The engine's table of loaded submodels holds 15,000 with no overflow check; past that the game
; crashes (0xBBBE70). A world archive with a bigger global region (worldlod) needs more. This many
; extra entries (24 bytes each) are used once the stock ones run out. 0 leaves the table alone.
SubmodelTableExtraNodes=60000
; The engine queues each frame's draws in a list of 16,384 with no reliable overflow check, and
; keeps their draw data in 4 MB per frame; past either the game crashes (0xBB5B5A, 0xBB5737,
; 0xC2A59A). Many draws at once (worldlod's map, a wide view, full-detail traffic) can pass them.
; The queue holds this many instead, the draw data grows with it (about 800 bytes per entry, 50 MB
; at 65536). A draw past the queue is dropped instead of crashing the game; should the draw data
; still run out, the game ends with a message to raise this. 16384 or less leaves the engine alone.
DrawQueueEntries=65536
; For testing the full-queue guard: frames hold only this many draws (1-16384; 0 is off).
DrawQueueTestEntries=0

[Ultrawide]
Enabled=1
; 0.0 uses the D3D9 backbuffer aspect. Override only if the game reports a scaled mode.
TargetAspect=0.0
; Widens 3D projection horizontally for ultrawide gameplay.
FOVScaling=1
; 0.0 auto-scales from the original 0.017453 value using current_aspect / 16:9.
FOVScalar=0.0
; Fits each screen cinematic using its Bink dimensions and native render-pass viewport.
; Preserves the supplied rectangle's center and bounds, including existing letterboxing.
CinematicDrawPatch=1

[DLSS5]
; Experimental DLSS 5 (README.md, "DLSS 5 (experimental)"). Off by default. To try it, set Export=1
; and Helper=1, with dlss5\dsf-dlss5-helper.exe and NVIDIA's nvngx_dlssnr.dll (from RTX Remix
; 1.6.1) in the dlss5 folder beside Driver.exe. Set both back to 0 to turn it off.
; Export alone publishes the pre-HUD point and the scene view-projection matrices (current and
; previous frame) in shared memory and to in-process callbacks (src/dlss5_shared.h).
Export=0
; Scene draws upload World*View*Proj rows from this vertex-shader register and their 3x4 world
; rows from WorldRegister; the view-projection is solved from both.
WorldViewProjRegister=0
WorldRegister=4
; Render-queue target set of the pass that composites the post chain and draws the HUD.
PreHudTargetSet=0
; Prototype: runs DLSS 5 through dsf-dlss5-helper.exe (dlss5/README.md), under the HUD. Needs
; Export=1, an RTX 50 GPU, the helper and the signed nvngx_dlssnr.dll you supply. Under DXVK the
; frames stay on the GPU; elsewhere they are copied through the CPU, which costs about 15 ms a frame.
Helper=0
; What DLSS 5 sees. 0: the finished frame just before the HUD (graded, film grain, bloom), and its
; output is drawn under the HUD. 1: the HDR scene before the game's post-processing, as RTX Remix
; does it: tone-mapped for DLSS 5 (HdrExposure, ACES, gamma), then tone-mapped back into the scene,
; and the game's bloom, tone map, colour grading, film grain and HUD run on the result. Measured
; offline on game frames, both change the picture about as much; 1 keeps the film grain and the
; grade out of DLSS 5's input. 1 is not yet tested in game, hence 0 by default.
Input=0
; Input=1: scale on the scene's linear values before the ACES curve. 0.6 brings the game's average
; scene brightness (0.28-0.40) near mid-grey. Higher shows DLSS 5 a brighter image. Only what DLSS 5
; sees changes: the tone map back undoes the scale.
HdrExposure=0.6
; Where the helper and nvngx_dlssnr.dll are. Relative paths start in the game folder (beside
; Driver.exe). Empty gives the same defaults.
HelperPath=dlss5\dsf-dlss5-helper.exe
HelperRuntime=dlss5
HelperLog=dsf-dlss5-helper.log
; 1 copies the frame through the helper without DLSS 5 (to compare).
HelperBypass=0
; How frames reach the helper. 0 picks Vulkan under DXVK and the CPU copy otherwise. 1 forces the
; CPU copy (works everywhere, about 15 ms a frame), 2 forces Vulkan (DXVK only, a few ms).
HelperTransport=0
; Logs frame times every 600 frames (present to present, DLSS 5 bridge cost).
FrameTimeLog=0
; Diagnostics: logs the first hardware fault and writes dsf_dlss5_crash_<pid>.dmp beside Driver.exe.
CrashDump=0
; Testing: runs DSF Enhanced's side of Helper=1 (the inputs, the tone map and back for Input=1, the
; draw back) without the helper, DLSS 5's output replaced by its input, so the picture should not
; change. Works with Export=1 and without the helper, an NVIDIA GPU or DXVK.
SelfTest=0
; DLSS 5 model (0-2) and strengths (0-1), Remix's defaults. On this game the defaults change the
; picture little (about 3-5 of 255 per channel on average); Style=1 with ToneStrength=1 and
; StructureStrength=1 about 5-13 of 255, measured on still game frames.
Style=0
Intensity=1.0
ToneStrength=0.3
StructureStrength=0.7
SkinStrength=0.5
; Cars (the player's, traffic, the interior in the cockpit view) get their own motion vectors
; from their previous transform. 0 gives every pixel camera motion only.
ObjectMotion=1
; Pixels nearer than this (metres) get zero motion: the car interior moves with the camera.
CockpitDepth=1.5
; Research: logs a few frames' render passes to dsf_enhanced.log, and with TraceDump=1 writes BMP
; dumps of the render targets to TraceDumpDir (default: dsf_dlss5_dumps beside Driver.exe), and the
; HDR scene target also as a PFM (dsf-dlss5-offscreen --hdr reads it).
Trace=0
TraceDump=0
; Also scans game memory for the camera matrix (stalls the traced frame for seconds).
TraceScan=0
; Writes each shader's disassembly (vs_<hash>.asm, ps_<hash>.asm) to TraceDumpDir.
TraceShaders=0
; Paints each car the object motion tagged in a flat colour of its own in the motion dumps.
ObjectMotionDebug=0
TraceDumpDir=
TraceStartSeconds=60
TraceIntervalSeconds=20
TraceCount=4
